<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website - Home</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header & Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <h1>My Blog</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="add-blog.html">Add Blog</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h2>Welcome to My Tech World</h2>
        <p>Explore articles, tutorials, and insights on web development.</p>
    </section>

    <!-- Main Content -->
    <main class="main-container">
        <section class="blog-section">
            <h2 class="section-title">Featured Posts</h2>
            
            <!-- Dynamically populated from Backend API (DAY 7 TASK) -->
            <div class="blog-grid" id="blog-grid">
                <p>Blogs loading ho rahe hain...</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 My Personal Blog. All rights reserved.</p>
    </footer>

    <!-- Day 7 Task: Backend API se Blog Posts fetch karne ka Script -->
    <script>
        async function fetchBlogs() {
            const blogGrid = document.getElementById('blog-grid');
            
            try {
                // Server (Day 6 & 7 API) se blogs mangwane ke liye fetch request
                const response = await fetch('http://localhost:3000/api/posts');
                const result = await response.json();

                // Clear loading text
                blogGrid.innerHTML = '';

                // Agar koi blog nahi hai toh empty message dikhao
                if (!result.data || result.data.length === 0) {
                    blogGrid.innerHTML = '<p>Koi blog nahi mila. Day 6 page par jaakar naya blog add karein!</p>';
                    return;
                }

                // Backend se aaye har blog ko HTML card bana kar display karna
                result.data.forEach(blog => {
                    const createdDate = blog.createdAt 
                        ? new Date(blog.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
                        : 'Recently';

                    const blogCard = `
                        <article class="blog-card">
                            <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=600&q=80" alt="Blog Image" class="card-image">
                            <div class="card-content">
                                <span class="card-tag">By ${blog.author || 'Anonymous'}</span>
                                <h3 class="card-title">${blog.title}</h3>
                                <p class="card-date">${createdDate}</p>
                                <p class="card-text">${blog.content}</p>
                                <a href="#" class="btn btn-primary">Read More</a>
                            </div>
                        </article>
                    `;
                    blogGrid.innerHTML += blogCard;
                });

            } catch (error) {
                console.error("Error loading blogs:", error);
                blogGrid.innerHTML = '<p style="color:red;">Server se blogs fetch nahi ho paye. Make sure `node server.js` chal raha ho!</p>';
            }
        }

        // Page load hote hi API call karna
        fetchBlogs();
    </script>

</body>
</html>
