<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Blog Post</title>
    <!-- CSS Link -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header & Navigation Bar -->
    <header>
        <h1>Create a New Blog Post</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="add-blog.html">Add Blog</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <!-- Main Content: Blog Form -->
    <main>
        <section>
            <h2>Post Details</h2>
            <!-- Added id="blogForm" and novalidate attribute -->
            <form id="blogForm" action="#" method="POST" novalidate>
                
                <!-- Blog Title -->
                <div>
                    <label for="title">Blog Title:</label><br>
                    <input type="text" id="title" name="title" placeholder="Enter post title">
                    <!-- Error Span -->
                    <br><span class="error" id="titleError"></span>
                </div>
                <br>

                <!-- Category -->
                <div>
                    <label for="category">Category:</label><br>
                    <select id="category" name="category">
                        <option value="">Select Category</option>
                        <option value="tech">Technology</option>
                        <option value="lifestyle">Lifestyle</option>
                        <option value="education">Education</option>
                    </select>
                    <!-- Error Span -->
                    <br><span class="error" id="categoryError"></span>
                </div>
                <br>

                <!-- Blog Content -->
                <div>
                    <label for="content">Blog Content:</label><br>
                    <textarea id="content" name="content" rows="6" cols="40" placeholder="Write your content here..."></textarea>
                    <!-- Error Span -->
                    <br><span class="error" id="contentError"></span>
                </div>
                <br>

                <!-- Submit Button -->
                <button type="submit">Publish Post</button>
                
                <!-- Success Message Container -->
                <div id="successMessage" class="success-msg"></div>

            </form>
        </section>
    </main>

    <hr>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Personal Blog. All rights reserved.</p>
    </footer>

    <!-- JS File Link (Mandatory for Day 4) -->
    <script src="script.js"></script>
</body>
</html>
